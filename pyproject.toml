[project]
name = "civic-tracker"
version = "0.1.0"
description = "Hyper-local civic complaint tracker with SLA escalation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "supabase>=2.13.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "streamlit>=1.41.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "pytest>=8.3.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
